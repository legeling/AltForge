name: CI

on:
  push:
    branches:
      - marketplace
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Test release metadata contract
        run: ruby Scripts/test_release_metadata.rb

  apple:
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Select Xcode
        run: sudo xcode-select --switch /Applications/Xcode_26.6.app

      - name: Install CocoaPods dependencies
        run: pod install --deployment

      - name: Resolve Swift packages
        run: >-
          xcodebuild -resolvePackageDependencies
          -workspace AltStore.xcworkspace
          -scheme AltStore
          -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages"

      - name: Build AltForge for iOS Simulator
        run: >-
          xcodebuild build
          -workspace AltStore.xcworkspace
          -scheme AltStore
          -configuration Debug
          -destination "generic/platform=iOS Simulator"
          -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages"
          -derivedDataPath "$RUNNER_TEMP/DerivedData-iOS"
          CODE_SIGNING_ALLOWED=NO

      - name: Test repository source identity
        run: >-
          xcodebuild test
          -workspace AltStore.xcworkspace
          -scheme AltStore
          -configuration Debug
          -destination "platform=iOS Simulator,name=iPhone 17 Pro,OS=latest"
          -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages"
          -derivedDataPath "$RUNNER_TEMP/DerivedData-iOS"
          CODE_SIGNING_ALLOWED=NO
          -only-testing:AltTests/AltTests/testSourceID

      - name: Build AltServer for macOS
        run: >-
          xcodebuild build
          -workspace AltStore.xcworkspace
          -scheme AltServer
          -configuration Debug
          -destination "generic/platform=macOS"
          -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages"
          -derivedDataPath "$RUNNER_TEMP/DerivedData-macOS"
          CODE_SIGNING_ALLOWED=NO

  windows:
    runs-on: windows-2025
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Build and package Windows AltServer
        shell: pwsh
        run: >-
          ./AltServer-Windows/Scripts/build-release.ps1
          -OutputDirectory "$env:RUNNER_TEMP/Artifacts"

      - name: Verify Windows artifact
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "Artifacts\AltForge-AltServer-Windows.zip"
          if (-not (Test-Path $archive)) { throw "Missing $archive" }
          if ((Get-Item $archive).Length -eq 0) { throw "Windows archive is empty." }

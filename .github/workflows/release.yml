name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      vcpkg_baseline: ${{ steps.version.outputs.vcpkg_baseline }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Validate release tag
        id: version
        shell: bash
        run: |
          ruby Scripts/check_release_version.rb --tag "$GITHUB_REF_NAME"
          echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"
          echo "vcpkg_baseline=$(ruby -rjson -e 'puts JSON.parse(File.read("AltServer-Windows/vcpkg.json")).fetch("builtin-baseline")')" >> "$GITHUB_OUTPUT"

      - name: Validate release metadata contract
        run: ruby Scripts/test_release_metadata.rb

      - name: Validate repository release policy
        run: ruby Scripts/test_repository_contract.rb

  apple:
    needs: prepare
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Select Xcode
        run: sudo xcode-select --switch /Applications/Xcode_26.6.app

      - name: Install CocoaPods dependencies
        run: |
          sudo gem install cocoapods -v 1.16.2 --no-document
          pod _1.16.2_ install --deployment

      - name: Resolve Swift packages
        run: >-
          xcodebuild -resolvePackageDependencies
          -workspace AltStore.xcworkspace
          -scheme AltStore
          -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages"

      - name: Test repository source identity
        run: >-
          xcodebuild test
          -workspace AltStore.xcworkspace
          -scheme AltStore
          -configuration Debug
          -destination "platform=iOS Simulator,name=iPhone 17 Pro,OS=latest"
          -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages"
          -derivedDataPath "$RUNNER_TEMP/DerivedData-Tests"
          CODE_SIGNING_ALLOWED=NO
          -only-testing:AltTests/AltTests/testSourceID
          -only-testing:AltTests/AltTests/testAltForgeSourceDeepLink

      - name: Build unsigned iOS application
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: >-
          xcodebuild build
          -workspace AltStore.xcworkspace
          -scheme AltStore
          -configuration Release
          -sdk iphoneos
          -destination "generic/platform=iOS"
          -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages"
          -derivedDataPath "$RUNNER_TEMP/DerivedData-iOS"
          MARKETING_VERSION="$VERSION"
          CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER"
          CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          app="$RUNNER_TEMP/DerivedData-iOS/Build/Products/Release-iphoneos/AltStore.app"
          test -d "$app"
          mkdir -p "$RUNNER_TEMP/Artifacts/Payload"
          ditto "$app" "$RUNNER_TEMP/Artifacts/Payload/AltStore.app"
          cd "$RUNNER_TEMP/Artifacts"
          ditto -c -k --sequesterRsrc --keepParent Payload AltForge.ipa
          find Payload -depth -delete

      - name: Build macOS application
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: >-
          xcodebuild build
          -workspace AltStore.xcworkspace
          -scheme AltServer
          -configuration Release
          -destination "generic/platform=macOS"
          -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages"
          -derivedDataPath "$RUNNER_TEMP/DerivedData-macOS"
          ARCHS="arm64 x86_64"
          ONLY_ACTIVE_ARCH=NO
          MARKETING_VERSION="$VERSION"
          CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER"
          CODE_SIGNING_ALLOWED=NO

      - name: Package macOS application
        run: |
          app="$RUNNER_TEMP/DerivedData-macOS/Build/Products/Release/AltForge Server.app"
          test -d "$app"
          Scripts/package_macos_dmg.sh \
            --app "$app" \
            --output "$RUNNER_TEMP/Artifacts/AltForge-AltServer-macOS.dmg" \
            --ad-hoc-sign

      - name: Verify Apple release artifacts
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: >-
          Scripts/verify_apple_release_artifacts.sh
          --artifacts "$RUNNER_TEMP/Artifacts"
          --version "$VERSION"
          --build "$GITHUB_RUN_NUMBER"

      - name: Upload Apple artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-apple
          path: |
            ${{ runner.temp }}/Artifacts/AltForge.ipa
            ${{ runner.temp }}/Artifacts/AltForge-AltServer-macOS.dmg
          if-no-files-found: error
          retention-days: 3

  windows:
    needs: prepare
    runs-on: windows-2025
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Check out pinned vcpkg
        uses: actions/checkout@v6
        with:
          repository: microsoft/vcpkg
          ref: ${{ needs.prepare.outputs.vcpkg_baseline }}
          path: .vcpkg

      - name: Bootstrap vcpkg
        shell: pwsh
        env:
          VCPKG_DISABLE_METRICS: "1"
        run: ./.vcpkg/bootstrap-vcpkg.bat -disableMetrics

      - name: Build and package Windows AltServer
        shell: pwsh
        env:
          VCPKG_ROOT: ${{ github.workspace }}\.vcpkg
          VCPKG_DISABLE_METRICS: "1"
        run: >-
          ./AltServer-Windows/Scripts/build-release.ps1
          -OutputDirectory "$env:RUNNER_TEMP/Artifacts"
          -Version "${{ needs.prepare.outputs.version }}"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: ${{ runner.temp }}/Artifacts/AltForge-AltServer-Windows.zip
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: [prepare, apple, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out release scripts
        uses: actions/checkout@v6

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: ${{ runner.temp }}/Artifacts
          merge-multiple: true

      - name: Generate source and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          ALT_FORGE_CDN_BASE_URL: ${{ vars.ALT_FORGE_CDN_BASE_URL }}
        shell: bash
        run: |
          previous_args=()
          if gh release view --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            mkdir -p "$RUNNER_TEMP/PreviousSource"
            gh release download --repo "$GITHUB_REPOSITORY" \
              --pattern apps.json \
              --dir "$RUNNER_TEMP/PreviousSource"
            previous_args=(--previous-source "$RUNNER_TEMP/PreviousSource/apps.json")
          fi

          cdn_args=()
          if [[ -n "$ALT_FORGE_CDN_BASE_URL" ]]; then
            cdn_args=(--cdn-base-url "$ALT_FORGE_CDN_BASE_URL")
          fi

          ruby Scripts/generate_release_metadata.rb \
            --artifacts "$RUNNER_TEMP/Artifacts" \
            --version "$VERSION" \
            --build "$GITHUB_RUN_NUMBER" \
            --date "$(date -u +%Y-%m-%d)" \
            "${cdn_args[@]}" \
            "${previous_args[@]}"

      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/Artifacts"
          sha256sum --check SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" \
            AltForge.ipa \
            AltForge-AltServer-macOS.dmg \
            AltForge-AltServer-Windows.zip \
            apps.json \
            flags.json \
            sources.json \
            recommended-sources.json \
            developerdisks.json \
            SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --draft \
            --title "AltForge $GITHUB_REF_NAME"
